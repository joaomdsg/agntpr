<!doctype html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body style="margin:0;padding:14px 16px;background:var(--ground)">
<div id="root"></div>
<script type="text/babel">
const NS = window.Packets || (() => { for (const k of Object.getOwnPropertyNames(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Terminal) return v; } catch (e) {} } return {}; })();
const { Terminal } = NS;
const D = ({ children }) => <span style={{ color: 'var(--text-disabled)' }}>{children}</span>;
ReactDOM.createRoot(document.getElementById('root')).render(
  <Terminal title="ci · deploy.yml">
    <div><D>$</D> packets check</div>
    <div><span style={{ color: 'var(--verified)' }}>✓ forwarded</span> <D>— 5/5 clauses green · 41s</D></div>
    <div><span style={{ color: 'var(--signal)' }}>⌁ held</span> <D>— handshake below lane floor (strict)</D></div>
    <div><D>&nbsp;&nbsp;→ open:</D> <span style={{ color: 'var(--signal)' }}>packets.dev/p/rate-limiter</span></div>
    <div style={{ height: 12 }} />
    <div><D>$</D> packets deployed <D># from your CD</D></div>
    <div><D>$</D> packets regressed <D># from your alerting</D></div>
  </Terminal>
);
</script></body></html>
