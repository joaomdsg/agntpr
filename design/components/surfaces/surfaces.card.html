<!-- @dsCard group="Components" viewport="700x230" name="Cards" subtitle="Bounded surfaces — flat, hairlined, shadowless" -->
<!doctype html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body style="margin:0;padding:16px 18px;background:var(--ground)">
<div id="root"></div>
<script type="text/babel">
const NS = window.Packets || (() => { for (const k of Object.getOwnPropertyNames(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Card && v.Chip) return v; } catch (e) {} } return {}; })();
const { Card, Chip } = NS;
const T = ({ children }) => <div className="mono" style={{ fontSize: 10.5, fontWeight: 700, color: 'var(--ink)' }}>{children}</div>;
const M = ({ children }) => <div className="mono" style={{ fontSize: 9.5, color: 'var(--text-muted)', marginTop: 7, lineHeight: 1.6 }}>{children}</div>;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
    <Card accent="var(--held)">
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <T>rate-limiter</T>
        <span style={{ marginLeft: 'auto' }}><Chip state="held">HELD · STRICT</Chip></span>
      </div>
      <M>queue card · accent = why it needs you</M>
    </Card>
    <Card><T>lane health</T><M>default card · surface-card + faint border</M></Card>
    <Card variant="row" style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
      <T>parse-retry rev4</T>
      <span className="mono" style={{ marginLeft: 'auto', fontSize: 9.5, color: 'var(--text-muted)' }}>row · in-flight list</span>
    </Card>
    <Card variant="dashed" style={{ textAlign: 'center' }}>
      <M>dashed · empty is a good state here</M>
    </Card>
  </div>
);
</script></body></html>
