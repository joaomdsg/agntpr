<!-- @dsCard group="Components" viewport="700x170" name="Chips" subtitle="State pills + neutral addr/rev chips" -->
<!doctype html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body style="margin:0;padding:16px 18px;background:var(--ground)">
<div id="root"></div>
<script type="text/babel">
const NS = window.Packets || (() => { for (const k of Object.getOwnPropertyNames(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Chip && v.PacketCell) return v; } catch (e) {} } return {}; })();
const { Chip } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
      <Chip state="held" size="lg">HELD · STRICT</Chip>
      <Chip state="risk" size="lg">IRREVERSIBLE</Chip>
      <Chip state="risk" bordered size="lg">STRICT · HELD</Chip>
      <Chip state="agent" size="lg">TRIGGER FIRE</Chip>
      <Chip state="delivered">DELIVERED</Chip>
      <Chip state="verified">FORWARDED</Chip>
    </div>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
      <Chip>acme/edge-gateway</Chip>
      <Chip active>acme/billing</Chip>
      <Chip size="sm">rev2</Chip>
      <Chip state="you" dot>you</Chip>
      <Chip state="agent" dot>agent</Chip>
      <Chip state="agent" size="sm">⚑ self-flag</Chip>
    </div>
    <div className="mono" style={{ fontSize: 9, color: 'var(--text-faint)' }}>tint recipe: color-mix(state 16%, surface) · border 40% · neutral = raised · active = signal 22%</div>
  </div>
);
</script></body></html>
