<!-- @dsCard group="Components" viewport="700x120" name="Buttons" subtitle="One accent action per screen" -->
<!doctype html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body style="margin:0;padding:16px 18px;background:var(--ground)">
<div id="root"></div>
<script type="text/babel">
const NS = window.Packets || (() => { for (const k of Object.getOwnPropertyNames(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Button && v.Chip) return v; } catch (e) {} } return {}; })();
const { Button } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
    <Button variant="primary">＋ New packet</Button>
    <Button variant="outline">Skim the sample</Button>
    <Button>clear ✕</Button>
    <Button variant="secondary">✎ Annotate selection</Button>
    <span style={{ display: 'inline-flex', gap: 6 }}>
      <Button variant="pager" disabled>◂</Button>
      <Button variant="pager">▸</Button>
    </span>
    <span className="mono" style={{ fontSize: 9, color: 'var(--text-faint)' }}>cta variant → marketing only</span>
  </div>
);
</script></body></html>
