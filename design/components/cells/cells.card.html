<!-- @dsCard group="Components" viewport="700x210" name="Packet cells & the mark" subtitle="One packet, one square — state is color" -->
<!doctype html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body style="margin:0;padding:16px 18px;background:var(--ground)">
<div id="root"></div>
<script type="text/babel">
const NS = window.Packets || (() => { for (const k of Object.getOwnPropertyNames(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.PacketCell && v.PacketMark) return v; } catch (e) {} } return {}; })();
const { PacketCell, PacketMark } = NS;
const L = ({ t, children }) => (
  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7 }}>
    {children}
    <span className="mono" style={{ fontSize: 9, color: 'var(--text-faint)' }}>{t}</span>
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 22 }}>
      <L t="composing"><PacketCell state="composing" size={22} /></L>
      <L t="in flight"><PacketCell state="inflight" size={22} /></L>
      <L t="verified"><PacketCell state="verified" size={22} /></L>
      <L t="held"><PacketCell state="held" size={22} /></L>
      <L t="risk · live"><PacketCell state="risk" size={22} live /></L>
      <L t="agent"><PacketCell state="agent" size={22} /></L>
      <L t="delivered"><PacketCell state="delivered" size={22} /></L>
      <span style={{ width: 1, alignSelf: 'stretch', background: 'var(--hairline)' }} />
      <L t="fallback 9px"><PacketCell state="composing" size={9} /></L>
    </div>
    <div style={{ display: 'flex', alignItems: 'center', gap: 30, borderTop: '1px solid var(--hairline)', paddingTop: 14 }}>
      <PacketMark cell={14} wordmark wordmarkSize={24} />
      <PacketMark cell={8} sub="inspector" />
      <PacketMark cell={8} />
      <PacketMark cell={8} held />
      <span className="mono" style={{ marginLeft: 'auto', fontSize: 9, color: 'var(--text-faint)', maxWidth: 180, lineHeight: 1.5 }}>lockup · stacked · mark · held (live)</span>
    </div>
  </div>
);
</script></body></html>
