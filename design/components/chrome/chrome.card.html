<!-- @dsCard group="Components" viewport="700x110" name="Titlebar" subtitle="The locked Inspector chrome pattern" -->
<!doctype html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body style="margin:0;padding:14px;background:var(--ground)">
<div id="root"></div>
<script type="text/babel">
const NS = window.Packets || (() => { for (const k of Object.getOwnPropertyNames(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Titlebar) return v; } catch (e) {} } return {}; })();
const { Titlebar } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{ border: '1px solid var(--hairline)', borderRadius: 12, overflow: 'hidden' }}>
    <Titlebar
      app="inspector" name="rate-limiter" rev="rev2" addr="acme/edge-gateway"
      status={{ state: 'risk', label: 'HELD · STRICT', detail: 'held 34m · handshake below lane floor' }}
      right={<>
        <span className="mono" style={{ fontSize: 10, fontWeight: 600, color: 'var(--signal)' }}>✎ you · 2</span>
        <span className="mono" style={{ fontSize: 10, fontWeight: 600, color: 'var(--agent)' }}>⚑ agents · 2</span>
      </>}
    />
    <div className="mono" style={{ padding: '8px 16px', fontSize: 9, color: 'var(--text-faint)', background: 'var(--surface-panel)' }}>hover the red packet for the status tooltip</div>
  </div>
);
</script></body></html>
