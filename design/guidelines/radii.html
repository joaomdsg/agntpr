<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Radius scale — chips are pills, cards 8–12, frames 14–16" name="Radii" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:18px;background:var(--ground)">
<div style="display:flex;align-items:flex-end;gap:12px">
  <div style="text-align:center"><div style="width:15px;height:15px;border-radius:4px;background:var(--surface-raised);border:1px solid var(--border-mid);margin:0 auto"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:7px">4<br>glyph</div></div>
  <div style="text-align:center"><div style="width:52px;height:30px;border-radius:7px;background:var(--surface-card);border:1px solid var(--border-faint)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:7px">7<br>btn-sm</div></div>
  <div style="text-align:center"><div style="width:64px;height:40px;border-radius:8px;background:var(--surface-card);border:1px solid var(--border-faint)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:7px">8<br>row card</div></div>
  <div style="text-align:center"><div style="width:64px;height:44px;border-radius:9px;background:var(--surface-raised);border-left:3px solid var(--signal)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:7px">9<br>annotation</div></div>
  <div style="text-align:center"><div style="width:72px;height:48px;border-radius:10px;background:var(--surface-card);border:1px solid var(--border-faint)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:7px">10<br>card</div></div>
  <div style="text-align:center"><div style="width:72px;height:52px;border-radius:12px;background:var(--surface-card);border:1px solid var(--border-faint)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:7px">12<br>stat</div></div>
  <div style="text-align:center"><div style="width:84px;height:56px;border-radius:16px;background:var(--surface-panel);border:1px solid var(--hairline)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:7px">16<br>shell</div></div>
  <div style="text-align:center"><div class="mono" style="height:20px;padding:0 10px;border-radius:10px;background:var(--surface-raised);color:var(--text-muted);font-size:9px;font-weight:700;display:inline-flex;align-items:center">PILL</div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:7px">h/2<br>chips</div></div>
</div>
</body></html>
