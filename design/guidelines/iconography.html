<!-- @dsCard group="Brand" viewport="700x150" subtitle="Unicode glyphs in Plex Mono — no icon font, no SVG icons" name="Iconography" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px;background:var(--ground)">
<div class="mono" style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px 18px;font-size:9px;color:var(--text-faint)">
  <div><span style="font-size:15px;color:var(--signal)">✎</span><br>you · annotate</div>
  <div><span style="font-size:15px;color:var(--agent)">⚑</span><br>flag · guardrail</div>
  <div><span style="font-size:15px;color:var(--verified)">●</span><br>live state</div>
  <div><span style="font-size:15px;color:var(--text-muted)">◂ ▸</span><br>pagers</div>
  <div><span style="font-size:15px;color:var(--signal)">⧉</span><br>scoped</div>
  <div><span style="font-size:15px;color:var(--signal)">✱</span><br>aside</div>
  <div><span style="font-size:15px;color:var(--text-muted)">⇄</span><br>split view</div>
  <div><span style="font-size:15px;color:var(--on-signal);background:var(--signal);border-radius:4px;padding:1px 4px">＋</span><br>new packet</div>
  <div><span style="font-size:15px;color:var(--text-muted)">✕</span><br>clear</div>
  <div><span style="font-size:15px;color:var(--signal)">→</span><br>links, trailing</div>
  <div><span style="font-size:15px;color:var(--risk)">⌁</span><br>held</div>
  <div><span style="font-size:15px;color:var(--verified)">✓</span><br>verified</div>
</div>
</body></html>
