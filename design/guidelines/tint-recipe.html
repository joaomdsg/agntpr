<!-- @dsCard group="Effects" viewport="700x140" subtitle="Tint recipe: color-mix(state 13–22%, surface); borders at 40–45%" name="Tint recipe" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:22px;background:var(--ground)">
<div class="mono" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
  <span style="display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:11px;background:color-mix(in srgb, var(--risk) 13%, var(--surface-card));border:1px solid color-mix(in srgb, var(--risk) 40%, var(--surface-card));color:var(--risk);font-size:9px;font-weight:700">HELD · STRICT</span>
  <span style="display:inline-flex;align-items:center;height:18px;padding:0 8px;border-radius:9px;background:color-mix(in srgb, var(--held) 16%, var(--surface-card));color:var(--held);font-size:9px;font-weight:700">IRREVERSIBLE</span>
  <span style="display:inline-flex;align-items:center;height:16px;padding:0 7px;border-radius:8px;background:color-mix(in srgb, var(--delivered) 16%, var(--surface-card));color:color-mix(in srgb, var(--delivered) 60%, white);font-size:9px;font-weight:700">DELIVERED</span>
  <span style="display:inline-flex;align-items:center;gap:4px;height:17px;padding:0 7px;border-radius:9px;background:color-mix(in srgb, var(--agent) 18%, var(--surface-raised));color:var(--agent);font-size:9px;font-weight:700">⚑ SELF-FLAG</span>
  <span style="display:inline-flex;align-items:center;height:17px;padding:0 8px;border-radius:9px;background:var(--surface-raised);color:var(--text-muted);font-size:9px;font-weight:600">acme/edge-gateway</span>
  <span style="display:inline-flex;align-items:center;height:17px;padding:0 7px;border-radius:9px;background:var(--surface-raised);color:var(--text-muted);font-size:9px;font-weight:600">rev2</span>
</div>
<div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:14px">fill 13–16% · strong 20–22% · border 40–45% · neutral chips flat --surface-raised</div>
</body></html>
