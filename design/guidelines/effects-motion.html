<!-- @dsCard group="Effects" viewport="700x150" subtitle="Live things pulse or glow; settled things are matte" name="Glows & motion" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:22px;background:var(--ground)">
<div style="display:flex;align-items:center;gap:40px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--verified);box-shadow:0 0 8px var(--verified);animation:pk-pulse 2s ease-in-out infinite"></span>
    <span class="mono" style="font-size:9px;color:var(--text-faint)">pk-pulse · live dot</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <span style="width:14px;height:14px;border-radius:3px;background:var(--risk);animation:pk-held-pulse 2s ease-in-out infinite"></span>
    <span class="mono" style="font-size:9px;color:var(--text-faint)">pk-held-pulse · held packet</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="width:160px;height:3px;background:var(--surface-raised);position:relative;overflow:hidden;border-radius:2px">
      <div style="position:absolute;top:0;left:0;height:100%;width:34%;background:linear-gradient(90deg,transparent,var(--signal),transparent);animation:pk-flow 2.6s linear infinite"></div>
    </div>
    <span class="mono" style="font-size:9px;color:var(--text-faint)">pk-flow · stream activity</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <span class="mono" style="display:inline-flex;align-items:center;height:34px;padding:0 16px;border-radius:8px;background:var(--signal);color:var(--on-signal);font-size:11px;font-weight:700;box-shadow:var(--glow-btn)">＋ New packet</span>
    <span class="mono" style="font-size:9px;color:var(--text-faint)">--glow-btn on accent</span>
  </div>
</div>
</body></html>
