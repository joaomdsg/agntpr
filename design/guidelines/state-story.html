<!-- @dsCard group="Brand" viewport="700x150" subtitle="outline → bright → dark: one packet's life, same addr both ends" name="State story" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:22px;background:var(--ground)">
<div style="display:flex;align-items:center;gap:26px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:9px">
    <span style="display:block;width:26px;height:26px;border-radius:6px;background:rgba(42,118,131,.08);border:5px solid var(--delivered)"></span>
    <span class="mono" style="font-size:9px;color:var(--text-faint)">composing</span>
  </div>
  <span class="mono" style="color:var(--text-disabled)">→</span>
  <div style="display:flex;flex-direction:column;align-items:center;gap:9px">
    <span style="display:block;width:26px;height:26px;border-radius:6px;background:var(--signal)"></span>
    <span class="mono" style="font-size:9px;color:var(--text-faint)">in flight</span>
  </div>
  <span class="mono" style="color:var(--text-disabled)">→</span>
  <div style="display:flex;flex-direction:column;align-items:center;gap:9px">
    <span style="display:block;width:26px;height:26px;border-radius:6px;background:var(--risk);box-shadow:0 0 12px rgba(240,102,107,.55)"></span>
    <span class="mono" style="font-size:9px;color:var(--risk)">held · you</span>
  </div>
  <span class="mono" style="color:var(--text-disabled)">→</span>
  <div style="display:flex;flex-direction:column;align-items:center;gap:9px">
    <span style="display:block;width:26px;height:26px;border-radius:6px;background:var(--delivered)"></span>
    <span class="mono" style="font-size:9px;color:var(--text-faint)">delivered</span>
  </div>
  <span class="mono" style="margin-left:auto;font-size:10px;line-height:1.7;color:var(--text-muted);max-width:220px">outline = promised<br>fill = landed<br>same color, same addr</span>
</div>
</body></html>
