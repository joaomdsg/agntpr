<!-- @dsCard group="Colors" viewport="700x150" subtitle="Ground + four surface steps" name="Grounds & surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:18px;background:var(--ground)">
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
  <div style="height:64px;border-radius:8px;background:var(--ground);border:1px solid var(--hairline)"></div>
  <div style="height:64px;border-radius:8px;background:var(--surface-deep);border:1px solid var(--hairline)"></div>
  <div style="height:64px;border-radius:8px;background:var(--surface-panel);border:1px solid var(--hairline)"></div>
  <div style="height:64px;border-radius:8px;background:var(--surface-card);border:1px solid var(--border-faint)"></div>
  <div style="height:64px;border-radius:8px;background:var(--surface-raised)"></div>
</div>
<div class="mono" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:8px;font-size:9px;color:var(--text-faint)">
  <span>--ground<br>#0a0d13</span><span>--surface-deep<br>#080a0f</span><span>--surface-panel<br>#0f131b</span><span>--surface-card<br>#141924</span><span>--surface-raised<br>#1b212e</span>
</div>
</body></html>
