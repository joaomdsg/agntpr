<!-- @dsCard group="Brand" viewport="700x180" subtitle="Locked mark spec + small-size fallback" name="The mark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:22px;background:var(--ground)">
<div style="display:flex;align-items:center;gap:44px">
  <span style="display:inline-flex;align-items:center;gap:26px">
    <span style="display:grid;grid-template-columns:repeat(2,22px);grid-auto-rows:22px;gap:6px">
      <span style="border-radius:5px;background:var(--signal)"></span>
      <span style="border-radius:5px;background:rgba(42,118,131,.08);border:4px solid var(--delivered);transform:scale(1.035)"></span>
      <span style="border-radius:5px;background:var(--signal)"></span>
      <span style="border-radius:5px;background:var(--delivered)"></span>
    </span>
    <span class="mono" style="font-size:38px;font-weight:700;letter-spacing:.04em;color:var(--ink);line-height:1">packets</span>
  </span>
  <span style="display:grid;grid-template-columns:repeat(2,8px);grid-auto-rows:8px;gap:2.5px">
    <span style="border-radius:2px;background:var(--signal)"></span>
    <span style="border-radius:2px;background:var(--delivered-mid)"></span>
    <span style="border-radius:2px;background:var(--signal)"></span>
    <span style="border-radius:2px;background:var(--delivered)"></span>
  </span>
  <span class="mono" style="font-size:9.5px;line-height:1.8;color:var(--text-faint)">gap 27% · radius 23% of cell<br>ghost: stroke 18%, tint 8%, scale 1.035<br>&lt; 14px cell: solid #357f8a fallback</span>
</div>
</body></html>
