<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Dense operational rhythm — everything bounded by hairlines" name="Spacing in use" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:18px;background:var(--ground)">
<div style="border:1px solid var(--hairline);border-radius:10px;background:var(--surface-panel);overflow:hidden;max-width:420px">
  <div style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--hairline);background:var(--surface-card)">
    <span style="width:8px;height:8px;border-radius:2px;background:var(--held)"></span>
    <span class="mono" style="font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--ink);text-transform:uppercase">needs you · 2</span>
    <span class="mono" style="margin-left:auto;font-size:9px;color:var(--text-faint)">12×16 header</span>
  </div>
  <div style="padding:14px;display:flex;flex-direction:column;gap:11px">
    <div style="border:1px solid var(--border-faint);border-left:3px solid var(--held);border-radius:10px;background:var(--surface-card);padding:14px 15px">
      <span class="mono" style="font-size:11px;font-weight:700;color:var(--ink)">rate-limiter</span>
      <span class="mono" style="font-size:9px;color:var(--text-faint);float:right">14×15 card pad</span>
    </div>
    <div class="mono" style="font-size:9px;color:var(--text-faint)">panel pad 14 · card gap 11 · chip gap 7</div>
  </div>
</div>
</body></html>
