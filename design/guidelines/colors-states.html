<!-- @dsCard group="Colors" viewport="700x170" subtitle="The packet-state color set — never invent new state colors" name="State grammar palette" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:18px;background:var(--ground)">
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px">
  <div><div style="height:46px;border-radius:8px;background:var(--signal)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:6px">--signal<br>in flight · you<br>#4cc4d4</div></div>
  <div><div style="height:46px;border-radius:8px;background:var(--delivered)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:6px">--delivered<br>landed<br>#2a7683</div></div>
  <div><div style="height:46px;border-radius:8px;background:var(--delivered-mid)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:6px">--delivered-mid<br>tiny-size ghost<br>#357f8a</div></div>
  <div><div style="height:46px;border-radius:8px;background:var(--verified)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:6px">--verified<br>clauses green<br>#46c08a</div></div>
  <div><div style="height:46px;border-radius:8px;background:var(--held)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:6px">--held<br>advisory hold<br>#e6b23e</div></div>
  <div><div style="height:46px;border-radius:8px;background:var(--risk)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:6px">--risk<br>blocking hold<br>#f0666b</div></div>
  <div><div style="height:46px;border-radius:8px;background:var(--agent)"></div><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:6px">--agent<br>agent authorship<br>#a78bfa</div></div>
</div>
</body></html>
